[package]
name = "teanga-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line tool to convert, load and view Teanga corpora"
license = "Apache-2.0"
repository = "https://github.com/TeangaNLP/teanga.rs"
homepage = "https://teanga.io/"
readme = "README.md"
keywords = ["nlp", "corpus", "annotation", "linguistics", "cli"]
categories = ["command-line-utilities", "text-processing"]
include = ["/src", "/README.md", "/LICENSE"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ciborium = "0.2.2"
clap = { version = "4.5.4", features = ["derive"] }
flate2 = "1.0.29"
serde_json = "1.0.116"
teanga = { path = "../teanga", version = "0.1.0", features = ["sled"] }
terminal_size = "0.4.4"

[[bin]]
name = "teanga-cli"
path = "src/main.rs"
