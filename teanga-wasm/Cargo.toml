# teanga-wasm/Cargo.toml
[package]
name = "teanga-wasm"
version = "0.1.0"
edition = "2021"
# Not released on crates.io
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Core WASM dependencies
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Web APIs
web-sys = { version = "0.3", features = [
  "console",
  "Performance",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
] }

# Teanga core library (without database features)
teanga = { path = "../teanga", default-features = false }

# WASM-specific optimizations
# wasm-pack uses "custom" for any --profile other than dev, release or profiling
[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-Os", "--enable-mutable-globals", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext"]

[features]
default = []
