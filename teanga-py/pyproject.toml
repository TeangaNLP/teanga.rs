[project]
name = "teanga_pyo3"
version = "0.1.1"
description = "Teanga - Rust Implementation"
authors = [{name="John P. McCrae",email="john@mccr.ae"}]
license = {text="Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: Apache Software License"
]

[project.urls]
"Homepage" = "https://github.com/teangaNLP/teanga.rs"
"Documentation" = "https://teanganlp.github.io/teanga/index.html"

[build-system]
requires = ["maturin>=1.3,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "teanga_pyo3.teanga"
bindings = 'pyo3'
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
